# Production stack for one VPS: PostgreSQL, one-shot schema and roles setup, the API, and Caddy in front with automatic HTTPS.
# Run from the repository root with the secrets file outside git:
#   docker compose -f deploy/compose.prod.yaml --env-file deploy/.env.prod up -d --build
# See deploy/README.md for every step on a fresh server.
name: stayguard
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayguard
      POSTGRES_DB: stayguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: only the other containers reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayguard -d stayguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: apply the schema as the database owner, then give the application role a password. The API itself connects as
  # stayguard_app, which is not a superuser, owns nothing and cannot bypass row-level security.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_DEMO_MODE: "0"
    command: ["migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://stayguard_app:${APP_DB_PASSWORD}@db:5432/stayguard?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://stayguard:${POSTGRES_PASSWORD}@db:5432/stayguard?sslmode=disable
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in deploy/.env.prod}
      ALLOW_PRIVILEGED_DB: "1" # the owner connection of this one-shot only; the API below never sets it
    depends_on:
      db:
        condition: service_healthy

  roles:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env.prod}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        psql -h db -U stayguard -d stayguard -v ON_ERROR_STOP=1 -v app_pw="$$APP_DB_PASSWORD" <<'SQL'
        ALTER ROLE stayguard_app LOGIN PASSWORD :'app_pw';
        SQL
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_DEMO_MODE: "0"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://stayguard_app:${APP_DB_PASSWORD}@db:5432/stayguard?sslmode=disable
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      DEMO_MODE: "0"
      # One proxy (Caddy) in front and the port below closed to the internet: see deploy/README.md.
      TRUST_PROXY: "1"
      TRUSTED_PROXY_HOPS: "1"
      FF_S1_ROOM_MAP: "1"
      FF_S2_CHECKIN: "1"
      FF_S3_CHECKOUT: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      roles:
        condition: service_completed_successfully
    # Reachable from Caddy on the compose network only.
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:

# Local stack: the API and PostgreSQL. LOCAL DEV ONLY: trust auth, and the API connects as the superuser
# database owner, so RLS is bypassed here. Real login roles (stayguard_app, stayguard_maint) arrive with the deploy story.
# Run `make migrate` (host port DB_HOST_PORT, default 5432) to create the schema; /readyz stays 503 until then.
name: stayguard
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stayguard
      POSTGRES_DB: stayguard
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayguard"]
      interval: 2s
      timeout: 3s
      retries: 15
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # DATA_ENCRYPTION_KEY: created by `make up` in the git-ignored .env.local.
    env_file: .env.local
    environment:
      DATABASE_URL: postgres://stayguard@db:5432/stayguard?sslmode=disable
      # Local dev only: the API connects as the superuser owner, which the startup check refuses otherwise.
      ALLOW_PRIVILEGED_DB: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: "no"

  # Backup target for local testing only (`make backup-test`): an S3-compatible store with one bucket created on start.
  # Not started by `make up`; enable it with `--profile backup`. Images: MINIO_IMAGE and MINIO_MC_IMAGE override the defaults. The keys come from the environment (see deploy/.env.example).
  minio:
    profiles: ["backup"]
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${BACKUP_S3_ACCESS_KEY:-stayguard-local}
      MINIO_ROOT_PASSWORD: ${BACKUP_S3_SECRET_KEY:-stayguard-local-secret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
  minio-init:
    profiles: ["backup"]
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:latest}
    restart: "no"
    depends_on:
      - minio
    environment:
      ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-stayguard-local}
      SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-stayguard-local-secret}
      BUCKET: ${BACKUP_S3_BUCKET:-stayguard-backups}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$ACCESS_KEY" "$$SECRET_KEY" >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing "local/$$BUCKET"

# Local stack: the API and PostgreSQL. Dev only: trust auth, and the API connects as the database owner.
# Run `make migrate` (DATABASE_URL below, host port 5433) to create the schema; /readyz stays 503 until then.
name: stayguard
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stayguard
      POSTGRES_DB: stayguard
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayguard"]
      interval: 2s
      timeout: 3s
      retries: 15
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://stayguard@db:5432/stayguard?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: "no"

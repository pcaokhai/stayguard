# Local stack: the API and PostgreSQL. LOCAL DEV ONLY: trust auth, and the API connects as the superuser
# database owner, so RLS is bypassed here. Real login roles (stayguard_app, stayguard_maint) arrive with the deploy story.
# Run `make migrate` (host port DB_HOST_PORT, default 5432) to create the schema; /readyz stays 503 until then.
name: stayguard
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stayguard
      POSTGRES_DB: stayguard
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayguard"]
      interval: 2s
      timeout: 3s
      retries: 15
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://stayguard@db:5432/stayguard?sslmode=disable
      # Local dev only: the API connects as the superuser owner, which the startup check refuses otherwise.
      ALLOW_PRIVILEGED_DB: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: "no"

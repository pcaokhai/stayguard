# Rehearsal overlay (see `make rehearse`): the production stack on this machine, in plain HTTP on one fixed local port. Same images,
# same non-superuser database role, DEMO_MODE off. Caddy is left out (profile "tls", never started), so a Cloudflare tunnel (or any
# proxy on this machine) points at http://localhost:${REHEARSE_PORT:-18090}. The web app is served by the api container. Local only.
services:
  # The rehearsal is production-like: the web is built WITHOUT the demo role picker unless NEXT_PUBLIC_DEMO_MODE says otherwise.
  migrate:
    build:
      args:
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-0}
  jobs:
    build:
      args:
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-0}
  caddy:
    profiles: ["tls"]
  api:
    build:
      args:
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-0}
    ports:
      - "127.0.0.1:${REHEARSE_PORT:-18090}:8080"
    environment:
      # REHEARSAL ONLY: scripted tests sign in many times a minute from one address. The production compose never sets these (limits 20
      # per address and 60 per guesthouse code per minute); the API logs a warning at start while they are raised.
      SIGNIN_RATE_PER_IP: "100000"
      SIGNIN_RATE_PER_CODE: "100000"
  # Optional backup target (REHEARSE_BACKUP=1): rclone's own S3 server from the official rclone image on Docker Hub. Nothing is
  # pulled from quay.io. The bucket is a folder made on start; the data lives in the container and goes with `make rehearse-down`.
  s3:
    profiles: ["backup"]
    image: rclone/rclone:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p "/data/$$BUCKET" && exec rclone serve s3 /data --addr :9000 --auth-key "$$ACCESS_KEY,$$SECRET_KEY"
    environment:
      ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY}
      SECRET_KEY: ${BACKUP_S3_SECRET_KEY}
      BUCKET: ${BACKUP_S3_BUCKET}
    ports:
      - "127.0.0.1:${REHEARSE_S3_PORT:-19100}:9000"

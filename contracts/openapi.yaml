components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC of the raw body
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID. Same key and body returns the first result; same key with a different body returns
        409.
      schema:
        type: string
        format: uuid
    BuildingId:
      name: buildingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    StayId:
      name: stayId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Unauthorized:
      description: Missing or expired credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (for example BUILDING_FORBIDDEN)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found, or not visible to this tenant
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict or idempotency-key reuse
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine code, e.g. ROOM_NOT_VACANT, BUILDING_FORBIDDEN
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - code
            properties:
              field:
                type: string
              code:
                type: string
    Vnd:
      type: integer
      format: int64
      description: Whole Vietnamese dong
    Locale:
      type: string
      enum:
      - vi
      - en
    LocalizedText:
      type: object
      required:
      - vi
      - en
      properties:
        vi:
          type: string
        en:
          type: string
    Role:
      type: string
      enum:
      - OWNER
      - MANAGER
      - RECEPTIONIST
      - HOUSEKEEPING
    PermissionLevel:
      type: string
      enum:
      - NONE
      - VIEW
      - EDIT
    RoomStatus:
      type: string
      enum:
      - VACANT
      - OCCUPIED
      - OVERDUE
      - TO_CLEAN
      - MAINTENANCE
    RentalType:
      type: string
      enum:
      - HOURLY
      - OVERNIGHT
      - DAILY
    StayStatus:
      type: string
      enum:
      - ACTIVE
      - CHECKED_OUT
    PaymentMethod:
      type: string
      enum:
      - CASH
      - TRANSFER
    PaymentStatus:
      type: string
      enum:
      - PENDING
      - PAID
      - EXPIRED
      - MISMATCH
    AlertKind:
      type: string
      enum:
      - ACCOUNT_LOCKED
      - CASH_OVER
      - CASH_SHORT
      - DAMAGE_REPORTED
      - LEAVE_REQUESTED
      - OVERPAID
      - PAYMENT_MISMATCH
      - PAYMENT_PARTIAL
      - PAYMENT_UNPAID
      - REFUND_PENDING
      - SEPAY_UPDATED
      - STAY_TIME_EDITED
      - STOCKTAKE_DIFFERENCE
      - UNMATCHED_TRANSFER
      - UNUSED_ROOM_REPORT
    CreateDemoSessionRequest:
      type: object
      additionalProperties: false
      required:
      - role
      - locale
      properties:
        role:
          $ref: '#/components/schemas/Role'
        locale:
          $ref: '#/components/schemas/Locale'
        tenantId:
          type: string
          description: Reuse an existing trial tenant so role switches share data
    User:
      type: object
      required:
      - id
      - name
      - role
      - locale
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        locale:
          $ref: '#/components/schemas/Locale'
    Session:
      type: object
      required:
      - accessToken
      - expiresAt
      - tenantId
      - user
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        tenantId:
          type: string
        user:
          $ref: '#/components/schemas/User'
    BuildingAccess:
      type: object
      required:
      - buildingId
      - level
      properties:
        buildingId:
          type: string
        level:
          $ref: '#/components/schemas/PermissionLevel'
    Me:
      type: object
      required:
      - user
      - tenant
      - buildingAccess
      properties:
        user:
          $ref: '#/components/schemas/User'
        tenant:
          type: object
          required:
          - id
          - name
          - timezone
          - currency
          properties:
            id:
              type: string
            name:
              type: string
            timezone:
              type: string
            currency:
              type: string
              const: VND
        buildingAccess:
          type: array
          items:
            $ref: '#/components/schemas/BuildingAccess'
    StatusCounts:
      type: object
      required:
      - vacant
      - occupied
      - overdue
      - toClean
      - maintenance
      properties:
        vacant:
          type: integer
        occupied:
          type: integer
        overdue:
          type: integer
        toClean:
          type: integer
        maintenance:
          type: integer
    Building:
      type: object
      required:
      - id
      - code
      - name
      - level
      - counts
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        level:
          $ref: '#/components/schemas/PermissionLevel'
        floors:
          type: array
          description: The building's floors in display order
          items:
            type: object
            required:
            - id
            - name
            - order
            properties:
              id:
                type: string
              name:
                type: string
              order:
                type: integer
        counts:
          $ref: '#/components/schemas/StatusCounts'
    StaySummary:
      type: object
      required:
      - id
      - rentalType
      - checkInAt
      - guestName
      - elapsedMinutes
      - runningTotal
      properties:
        id:
          type: string
        rentalType:
          $ref: '#/components/schemas/RentalType'
        checkInAt:
          type: string
          format: date-time
        guestName:
          type: string
        elapsedMinutes:
          type: integer
        runningTotal:
          $ref: '#/components/schemas/Vnd'
        pendingPayment:
          description: Set once the stay is checked out and its invoice is not paid (the room stays OCCUPIED until it is). runningTotal is then the invoice total and elapsedMinutes stops at check-out.
          oneOf:
          - $ref: '#/components/schemas/PendingPayment'
          - type: 'null'
    PendingPayment:
      type: object
      description: Where the check-out of a stay stands while its invoice is open, enough to resume it. The same for every kind of stay (an open deposit refund, a transfer chosen and not paid, a partial transfer).
      required:
      - paymentId
      - total
      - deposit
      - received
      - remaining
      - refundDue
      - createdAt
      properties:
        paymentId:
          type:
          - string
          - 'null'
          description: The pending transfer payment (its QR shows the remaining amount); null until a transfer payment was created.
        total:
          description: The frozen bill.
          $ref: '#/components/schemas/Vnd'
        deposit:
          description: Deposit taken at check-in.
          $ref: '#/components/schemas/Vnd'
        received:
          description: Bank money received for the invoice that did not settle it yet (partial transfers); the deposit is not included.
          $ref: '#/components/schemas/Vnd'
        remaining:
          description: What is still to be paid (total minus deposit minus received, never below 0).
          $ref: '#/components/schemas/Vnd'
        refundDue:
          description: Deposit to give back in cash when it is more than the bill; 0 otherwise.
          $ref: '#/components/schemas/Vnd'
        createdAt:
          type: string
          format: date-time
          description: Server time of the check-out; the bill is frozen at this moment.
    Room:
      type: object
      required:
      - id
      - code
      - buildingId
      - floor
      - unitType
      - status
      properties:
        id:
          type: string
        code:
          type: string
        buildingId:
          type: string
        floorId:
          type: string
        floorName:
          type: string
        floor:
          type: integer
        unitType:
          type: object
          required:
          - code
          - name
          properties:
            code:
              type: string
            name:
              $ref: '#/components/schemas/LocalizedText'
        status:
          $ref: '#/components/schemas/RoomStatus'
        note:
          type:
          - string
          - 'null'
          description: Free text such as a maintenance reason
        activeStay:
          oneOf:
          - $ref: '#/components/schemas/StaySummary'
          - type: 'null'
    Service:
      type: object
      required:
      - code
      - name
      - price
      - stock
      properties:
        code:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedText'
        price:
          $ref: '#/components/schemas/Vnd'
        stock:
          type: integer
          minimum: 0
        unit:
          type: string
        lowStockAt:
          type: integer
          minimum: 0
        onSale: *id006
        latestUnitCost:
          oneOf:
          - &id011
            $ref: '#/components/schemas/Vnd'
          - type: 'null'
        soldLast7Days: &id010
          type: integer
    CreateStayRequest:
      type: object
      additionalProperties: false
      required:
      - rentalType
      - guestName
      - guestPhone
      - deposit
      properties:
        rentalType:
          $ref: '#/components/schemas/RentalType'
        guestName:
          type: string
          minLength: 1
          maxLength: 120

openapi: 3.1.0
info:
  title: StayGuard API
  version: 1.7.0
  summary: 'Anti-loss guesthouse management API: demo scope plus production v1.1 from the design (docs/15).'
  description: "Contract-first source of truth. Prose companion: docs/04-api-contract.md.\nMoney is a whole number of VND.\
    \ Times are RFC 3339 with offset. The API returns codes and\nstructured values, never display text; the web app translates.\n\
    Extensions: `x-story` (owning story), `x-access` (minimum building access on the target\nbuilding: VIEW or EDIT; OWNER\
    \ means owner role), `x-release` (demo | full).\n    x-access values added in 1.1: PUBLIC, ANY, ANY_STAFF, OWNER_OR_MANAGER,\
    \ EDIT_ANY (EDIT on at least one building).\n"
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: /
  description: Same origin (the Go binary serves both the API and the web app)
security:
- bearerAuth: []
tags:
- name: Session
- name: Rooms
- name: Stays
- name: Payments
- name: Housekeeping
- name: Owner
- name: Shifts
- name: Ops
- name: Auth
- name: Staff
- name: Roster
- name: Payroll
- name: Maintenance
- name: Expenses
- name: Reports
- name: Setup
- name: Stock
paths:
  /v1/demo/sessions:
    post:
      tags:
      - Session
      operationId: createDemoSession
      summary: Start a trial session for a role (demo mode only)
      description: >-
        Returns 404 unless DEMO_MODE is enabled. Rate-limited per IP. Browser sessions: the response also sets the HttpOnly cookie `sg_session` (same value as `accessToken`; SameSite=Strict, Path=/, no Domain, no Max-Age, Secure over HTTPS; over plain HTTP only for localhost, otherwise no cookie is set). Every authenticated operation accepts either the cookie or `Authorization: Bearer`; the header wins. A state-changing request (POST, PUT, PATCH, DELETE) authenticated by the cookie must carry `X-Requested-With: stayguard` and an Origin (or Referer) with this host, otherwise 403 `CSRF_REJECTED`. Bearer requests need neither.
      security: []
      x-story: SG-102
      x-release: demo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDemoSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me:
    get:
      tags:
      - Session
      operationId: getMe
      summary: Current user, tenant and building access
      x-story: SG-102
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/locale:
    put:
      tags:
      - Session
      operationId: setMyLocale
      summary: Save the caller's preferred language
      x-story: SG-102
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - locale
              properties:
                locale:
                  $ref: '#/components/schemas/Locale'
      responses:
        '204':
          description: Saved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/buildings:
    get:
      tags:
      - Rooms
      operationId: listBuildings
      summary: Buildings the caller may see, with status counters
      description: Buildings with access NONE are omitted.
      x-story: SG-201
      x-access: VIEW
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/buildings/{buildingId}/rooms:
    get:
      tags:
      - Rooms
      operationId: listRooms
      summary: Rooms of a building with status and active stay summary
      description: Bounded by domain size (at most 200 rooms per building), so not paginated.
      x-story: SG-201
      x-access: VIEW
      parameters:
      - $ref: '#/components/parameters/BuildingId'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/RoomStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/rooms/{roomId}:
    get:
      tags:
      - Rooms
      operationId: getRoom
      summary: One room with its active stay summary
      x-story: SG-201
      x-access: VIEW
      parameters:
      - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/services:
    get:
      tags:
      - Stays
      operationId: listServices
      summary: Extras catalogue (drinks, food, towels) with stock
      x-story: SG-205
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/rooms/{roomId}/stays:
    post:
      tags:
      - Stays
      operationId: createStay
      summary: Check a guest into a vacant room
      description: The server records check-in time; clients cannot supply it.
      x-story: SG-203
      x-access: EDIT
      parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStayRequest'
      responses:
        '201':
          description: Stay created; room is now OCCUPIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stay'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/stays/{stayId}:
    get:
      tags:
      - Stays
      operationId: getStay
      summary: Stay with a live running total
      x-story: SG-203
      x-access: VIEW
      parameters:
      - $ref: '#/components/parameters/StayId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stay'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/stays/{stayId}/extras:
    post:
      tags:
      - Stays
      operationId: addStayExtras
      summary: Add extras to an active stay
      x-story: SG-205
      x-access: EDIT
      parameters:
      - $ref: '#/components/parameters/StayId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddExtrasRequest'
      responses:
        '200':
          description: Updated stay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stay'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/stays/{stayId}/checkout:
    post:
      tags:
      - Stays
      operationId: checkoutStay
      summary: End the stay and produce the final invoice
      description: The server records check-out time. Repeating the request returns the same invoice.
      x-story: SG-205
      x-access: EDIT
      parameters:
      - $ref: '#/components/parameters/StayId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Invoice created; room is now TO_CLEAN once paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/invoices/{invoiceId}/payments:
    post:
      tags:
      - Payments
      operationId: createPayment
      summary: Start a cash or bank-transfer payment for an invoice
      description: 'TRANSFER returns a QR payload for the exact amount, always for the tenant''s own account.

        CASH is recorded on the caller''s open shift.

        '
      x-story: SG-301
      x-access: EDIT
      parameters:
      - $ref: '#/components/parameters/InvoiceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/payments/{paymentId}:
    get:
      tags:
      - Payments
      operationId: getPayment
      summary: Payment status (polling fallback for the event stream)
      x-story: SG-301
      x-access: VIEW
      parameters:
      - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/payments/{paymentId}/events:
    get:
      tags:
      - Payments
      operationId: streamPaymentEvents
      summary: Server-Sent Events for one payment
      description: 'Event payload schema: contracts/events/payment-events.schema.json. The stream sends the

        current state first, then changes, and closes after a terminal state. Supports Last-Event-ID.

        '
      x-story: SG-302
      x-access: VIEW
      parameters:
      - $ref: '#/components/parameters/PaymentId'
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/demo/payments/{paymentId}/simulate:
    post:
      tags:
      - Payments
      operationId: simulatePaymentReceived
      summary: Simulate the bank reporting the money as received (demo mode only)
      description: 'Returns 404 unless DEMO_MODE is enabled. Creates a payment event exactly like the real

        webhook and runs the same handler.

        '
      x-story: SG-302
      x-access: EDIT
      x-release: demo
      parameters:
      - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Handler result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/housekeeping/tasks:
    get:
      tags:
      - Housekeeping
      operationId: listHousekeepingTasks
      summary: Rooms waiting to be cleaned in buildings the caller may edit or view
      x-story: SG-401
      x-access: VIEW
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HousekeepingTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/housekeeping/tasks/{taskId}/complete:
    post:
      tags:
      - Housekeeping
      operationId: completeHousekeepingTask
      summary: Mark a room clean; the room becomes VACANT
      x-story: SG-401
      x-access: EDIT
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HousekeepingTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      description: Allowed for OWNER, MANAGER, RECEPTIONIST and HOUSEKEEPING with EDIT on the building; records who and when.
  /v1/rooms/{roomId}/usage-reports:
    post:
      tags:
      - Housekeeping
      operationId: reportRoomUsage
      summary: Report a room that looks used but has no active stay
      description: Creates an owner alert.
      x-story: SG-401
      x-access: EDIT
      parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/owner/overview:
    get:
      tags:
      - Owner
      operationId: getOwnerOverview
      summary: Revenue, cash expected, occupancy, alerts and latest payments for a day
      x-story: SG-403
      x-access: OWNER
      parameters:
      - name: date
        in: query
        required: false
        description: Tenant-local date; defaults to today.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/owner/staff-permissions:
    get:
      tags:
      - Owner
      operationId: listStaffPermissions
      summary: Every staff member with their access level per building
      x-story: SG-501
      x-access: OWNER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffPermission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/owner/staff/{userId}/building-permissions/{buildingId}:
    put:
      tags:
      - Owner
      operationId: setBuildingPermission
      summary: Grant, change or revoke one staff member's access to one building
      description: Takes effect immediately and is recorded in the audit log.
      x-story: SG-501
      x-access: OWNER
      parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - level
              properties:
                level:
                  $ref: '#/components/schemas/PermissionLevel'
      responses:
        '200':
          description: Updated permission row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/shifts/current:
    get:
      tags:
      - Shifts
      operationId: getCurrentShift
      summary: The caller's open shift with the cash the system expects
      x-story: SG-503
      x-access: EDIT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/shifts/current/close:
    post:
      tags:
      - Shifts
      operationId: closeShift
      summary: Close the caller's shift with a counted cash total
      description: A reason is required when counted cash differs from expected cash, or when the shift still lists invoices that are not fully paid (Shift.unpaidInvoices). Figures lock on close.
      x-story: SG-503
      x-access: EDIT
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseShiftRequest'
      responses:
        '200':
          description: Closed shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/shifts/current/payouts:
    post:
      tags:
      - Shifts
      operationId: recordCashPayout
      summary: Record cash paid out of the drawer during the shift (for example ice)
      x-story: SG-503
      x-access: EDIT
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashPayoutRequest'
      responses:
        '200':
          description: Updated shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/owner/shifts/{shiftId}:
    get:
      tags:
      - Owner
      operationId: getShiftReview
      summary: Reconciliation detail of a closed shift
      x-story: SG-503
      x-access: OWNER
      parameters:
      - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /healthz:
    get:
      tags:
      - Ops
      operationId: getHealth
      summary: Liveness
      security: []
      x-story: SG-001
      responses:
        '200':
          description: Process is up
  /readyz:
    get:
      tags:
      - Ops
      operationId: getReadiness
      summary: Readiness (database reachable, migrations applied)
      security: []
      x-story: SG-003
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready
  /v1/auth/sign-in:
    post:
      tags:
      - Auth
      operationId: signIn
      summary: Sign in with guesthouse code, user name and PIN
      x-story: SG-701
      x-access: PUBLIC
      x-release: full
      description: >-
        Five wrong PINs lock the account for 15 minutes and alert the owner (ACCOUNT_LOCKED). Responses never reveal
        whether the user exists. Browser sessions: the response also sets the HttpOnly cookie `sg_session` (same value as `accessToken`; SameSite=Strict, Path=/, no Domain, no Max-Age, Secure over HTTPS; over plain HTTP only for localhost, otherwise no cookie is set). Every authenticated operation accepts either the cookie or `Authorization: Bearer`; the header wins. A state-changing request (POST, PUT, PATCH, DELETE) authenticated by the cookie must carry `X-Requested-With: stayguard` and an Origin (or Referer) with this host, otherwise 403 `CSRF_REJECTED`. Bearer requests need neither.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /v1/auth/sign-out:
    post:
      tags:
      - Auth
      operationId: signOut
      summary: End the current session
      description: >-
        Revokes the session on the server and clears the `sg_session` cookie (Set-Cookie with Max-Age=0).
      x-story: SG-701
      x-access: ANY
      x-release: full
      responses:
        '204': &id001
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/pin:
    put:
      tags:
      - Auth
      operationId: changeMyPin
      summary: Change my PIN (required after a one-time PIN)
      x-story: SG-701
      x-access: ANY
      x-release: full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePinRequest'
      responses:
        '204': *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/owner/staff:
    get:
      tags:
      - Staff
      operationId: listStaff
      summary: Staff with position, app access, contract and building access
      x-story: SG-1101
      x-access: OWNER
      x-release: full
      parameters:
      - name: position
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Position'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Staff'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Staff
      operationId: createStaff
      summary: Add a staff member; returns a one-time PIN when appAccess is not NONE
      x-story: SG-1101
      x-access: OWNER
      x-release: full
      parameters:
      - &id002
        $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:

  /v1/webhooks/bank/{hookId}:
    post:
      tags:
      - Payments
      operationId: receiveBankWebhook
      summary: Bank or reconciliation-provider webhook (full product)
      description: 'SePay webhook, one path per tenant. Looks up the tenant by hookId, checks X-SePay-Timestamp (within 300 s)
        and X-SePay-Signature (sha256= and the hex HMAC-SHA256 of "{timestamp}.{raw body}" keyed by the secret) with a
        constant-time compare, then runs the same settlement handler as the demo simulator. Only incoming transfers settle;
        outgoing ones are stored and ignored. Deduplicated on SePay''s transaction id: a duplicate gets the same 200
        {"success": true}. Unknown hookId returns 404, a bad signature 401 with no detail. The secret is written only by the
        installer CLI (docs/runbooks/sepay-handover.md); no endpoint reads or writes it.'
      security:
      - webhookSignature: []
      x-release: full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankWebhookPayload'
      responses:
        '200':
          description: 'Accepted; SePay needs exactly {"success": true} (also returned for duplicates)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '202':
          description: Accepted (also returned for duplicates)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: hookId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      x-story: SG-703
  /v1/webhooks/bank:
    post:
      tags:
      - Payments
      operationId: receiveBankWebhookLegacy
      summary: 'Deprecated: single bank webhook (replaced by /v1/webhooks/bank/{hookId})'
      description: 'Kept only so existing configurations fail loudly: answers 410 GONE. Use receiveBankWebhook at /v1/webhooks/bank/{hookId}.'
      security:

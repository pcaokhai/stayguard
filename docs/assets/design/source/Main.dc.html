<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sơ đồ phòng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#F6F4EF;color:#1C1B19}
a{color:#1F4E5F}a:hover{color:#163A47}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F4EF; display: flex; flex-direction: column; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #1C1B19">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 20px 20px 12px 20px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<span style="font-size: 20px; font-weight: 700">Nhà nghỉ Demo</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<span style="font-size: 13px; color: #5C5A55">Lễ tân · Ca sáng · 14:00, 30/09</span>
<a href="GiaoCa.dc.html" style="height: 40px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; border: 1px solid #CFCBC3; background: #FFFFFF; color: #1C1B19; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; flex-shrink: 0">Kết ca</a>
</div>
</div>
<div style="display: flex; gap: 8px; padding: 4px 20px 12px 20px">
<button type="button" onClick="{{pickA}}" aria-pressed="{{isA}}" style="flex-grow: 1; height: 44px; border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: 600; background: {{tabA.bg}}; color: {{tabA.fg}}; border: {{tabA.border}}; white-space: nowrap">Tòa A (18)</button>
<button type="button" onClick="{{pickB}}" aria-pressed="{{isB}}" style="flex-grow: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 15px; font-weight: 600; background: {{tabB.bg}}; color: {{tabB.fg}}; border: {{tabB.border}}; white-space: nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg><span>Tòa B (17)</span></button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 14px 20px">
<sc-for list="{{counters}}" as="c" hint-placeholder-count="5">
<span style="font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.border}}">{{c.label}} {{c.count}}</span>
</sc-for>
</div>
<sc-if value="{{isB}}" hint-placeholder-val="{{false}}">
<div style="margin: 0 20px 12px 20px; display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: #ECE9E2; color: #45433F"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg><span style="font-size: 13px">Bạn chỉ có quyền xem Tòa B. Cần thao tác thì nhờ chủ nhà cấp quyền.</span></div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 20px">
<sc-for list="{{rooms}}" as="r" hint-placeholder-count="18">
<a href="{{r.href}}" style="height: 76px; box-sizing: border-box; padding: 10px; border-radius: 10px; display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; background: {{r.bg}}; border: 1px solid {{r.border}}; color: {{r.fg}}; opacity: {{r.opacity}}">
<span style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 16px; font-weight: 700">{{r.code}}</span><sc-if value="{{r.locked}}" hint-placeholder-val="{{false}}"><span aria-label="Chỉ xem" style="display: flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span></sc-if></span>
<span style="font-size: 12px; font-weight: 600">{{r.label}}</span>
<span style="font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
</a>
</sc-for>
</div>
<p style="margin: 16px 20px 0 20px; font-size: 13px; color: #5C5A55">Chạm phòng trống để nhận phòng, chạm phòng có khách để xem tiền tạm tính.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F4E5F","options":["#1F4E5F","#7A3E12","#2F4B2A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { b: 'A' }; }
renderVals() {
const S = {
vacant: { label: 'Trống', bg: '#E4F1E7', fg: '#1F5A30', border: '#B9DBC2' },
occupied: { label: 'Có khách', bg: '#DDE8F6', fg: '#1C4A82', border: '#AFC6E6' },
overdue: { label: 'Quá giờ', bg: '#FBE1CC', fg: '#8A3A0A', border: '#F0B78C' },
dirty: { label: 'Cần dọn', bg: '#F6EDC2', fg: '#5E4A00', border: '#E3D27D' },
maint: { label: 'Bảo trì', bg: '#E7E5E0', fg: '#4A4843', border: '#CFCBC3' }
};
const raw = [
['A101','occupied','Giờ · 2g35'],['A102','vacant','Phòng thường'],['A103','dirty','Khách vừa trả'],
['A104','occupied','Ngày · đến 12:00'],['A105','vacant','Phòng thường'],['A106','vacant','Phòng thường'],
['A201','overdue','Ngày · quá 2g'],['A202','occupied','Giờ · 0g50'],['A203','vacant','Phòng thường'],
['A204','vacant','Phòng thường'],['A205','maint','Hỏng điều hòa'],['A206','occupied','Giờ · 1g20'],
['A301','vacant','VIP'],['A302','dirty','Khách vừa trả'],['A303','occupied','Giờ · 0g15'],
['A304','vacant','VIP'],['A305','occupied','Ngày · đến 12:00'],['A306','vacant','VIP']
];
const rawB = [['B101','vacant','Phòng thường'],['B102','occupied','Giờ · 0g25'],['B103','vacant','Phòng thường'],['B104','dirty','Khách vừa trả'],['B105','vacant','Phòng thường'],['B106','occupied','Ngày · đến 12:00'],['B201','vacant','Phòng thường'],['B202','vacant','Phòng thường'],['B203','occupied','Giờ · 1g05'],['B204','vacant','Phòng thường'],['B205','vacant','Phòng thường'],['B206','dirty','Khách vừa trả'],['B301','vacant','VIP'],['B302','occupied','Giờ · 3g10'],['B303','vacant','VIP'],['B304','vacant','VIP'],['B305','vacant','VIP']];
const b = this.state.b;
const locked = b === 'B';
const list = locked ? rawB : raw;
const self = 'Main.dc.html';
const rooms = list.map(([code, st, sub]) => Object.assign({ code, sub, locked, opacity: locked ? '0.62' : '1', href: locked ? self : st === 'vacant' ? 'NhanPhong.dc.html' : (st === 'occupied' || st === 'overdue') ? 'ChiTiet.dc.html' : self }, S[st]));
const order = ['vacant','occupied','overdue','dirty','maint'];
const counters = order.map(k => Object.assign({ count: list.filter(r => r[1] === k).length }, S[k]));
const accent = this.props.accent ?? '#1F4E5F';
const on = { bg: accent, fg: '#FFFFFF', border: 'none' }, off = { bg: '#FFFFFF', fg: '#1C1B19', border: '1px solid #CFCBC3' };
return { accent, rooms, counters, isA: !locked, isB: locked, tabA: locked ? off : on, tabB: locked ? on : off, pickA: () => this.setState({ b: 'A' }), pickB: () => this.setState({ b: 'B' }) };
}
}
</script>
</body>
</html>

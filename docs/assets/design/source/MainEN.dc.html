<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#F6F4EF;color:#1C1B19}
a{color:#1F4E5F}a:hover{color:#163A47}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F4EF; display: flex; flex-direction: column; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #1C1B19">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 20px 20px 12px 20px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<span style="font-size: 20px; font-weight: 700">Demo Guesthouse</span>
<div style="display: flex; gap: 8px"><a href="LichSuLuotOEN.dc.html" aria-label="Stay history" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid #CFCBC3; background: #FFFFFF; color: #1C1B19; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></a><a href="TaiKhoanEN.dc.html" aria-label="Account" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid #CFCBC3; background: #FFFFFF; color: #1C1B19; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a></div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<span style="font-size: 13px; color: #5C5A55">Front desk · Morning shift · 14:00, 30 Sep</span>
<a href="GiaoCaEN.dc.html" style="height: 40px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; border: 1px solid #CFCBC3; background: #FFFFFF; color: #1C1B19; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; flex-shrink: 0">End shift</a>
</div>
</div>
<div role="group" aria-label="Choose a building" style="display: flex; flex-shrink: 0; gap: 8px; overflow-x: auto; padding: 4px 20px 12px 20px">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
<button type="button" onClick="{{tb.pick}}" aria-pressed="{{tb.on}}" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; background: {{tb.bg}}; color: {{tb.fg}}; border: {{tb.border}}"><sc-if value="{{tb.locked}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></sc-if><span>{{tb.label}}</span></button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 14px 20px">
<sc-for list="{{counters}}" as="c" hint-placeholder-count="5">
<span style="font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.border}}">{{c.label}} {{c.count}}</span>
</sc-for>
</div>
<sc-if value="{{isB}}" hint-placeholder-val="{{false}}">
<div style="margin: 0 20px 12px 20px; display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: #ECE9E2; color: #45433F"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg><span style="font-size: 13px">You can only view Building B. Ask the owner for access to make changes.</span></div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 20px">
<sc-for list="{{rooms}}" as="r" hint-placeholder-count="18">
<a href="{{r.href}}" style="height: 76px; box-sizing: border-box; padding: 10px; border-radius: 10px; display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; background: {{r.bg}}; border: 1px solid {{r.border}}; color: {{r.fg}}; opacity: {{r.opacity}}">
<span style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 16px; font-weight: 700">{{r.code}}</span><sc-if value="{{r.locked}}" hint-placeholder-val="{{false}}"><span aria-label="View only" style="display: flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span></sc-if></span>
<span style="font-size: 12px; font-weight: 600">{{r.label}}</span>
<span style="font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
</a>
</sc-for>
</div>
<p style="margin: 16px 20px 0 20px; font-size: 13px; color: #5C5A55">Tap a vacant room to check in, or an occupied room to see the running total.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F4E5F","options":["#1F4E5F","#7A3E12","#2F4B2A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { b: 'A' }; }
renderVals() {
const S = {
vacant: { label: 'Vacant', bg: '#E4F1E7', fg: '#1F5A30', border: '#B9DBC2' },
occupied: { label: 'Occupied', bg: '#DDE8F6', fg: '#1C4A82', border: '#AFC6E6' },
overdue: { label: 'Overdue', bg: '#FBE1CC', fg: '#8A3A0A', border: '#F0B78C' },
dirty: { label: 'To clean', bg: '#F6EDC2', fg: '#5E4A00', border: '#E3D27D' },
maint: { label: 'Maintenance', bg: '#E7E5E0', fg: '#4A4843', border: '#CFCBC3' }
};
const raw = [
['A101','occupied','Hourly · 2h 35m'],['A102','vacant','Standard'],['A103','dirty','Checked out'],
['A104','occupied','Daily · until 12:00'],['A105','vacant','Standard'],['A106','vacant','Standard'],
['A201','overdue','Daily · 2h over'],['A202','occupied','Hourly · 50m'],['A203','vacant','Standard'],
['A204','vacant','Standard'],['A205','maint','A/C broken'],['A206','occupied','Hourly · 1h 20m'],
['A301','vacant','VIP'],['A302','dirty','Checked out'],['A303','occupied','Hourly · 15m'],
['A304','vacant','VIP'],['A305','occupied','Daily · until 12:00'],['A306','vacant','VIP']
];
const rawB = [['B101','vacant','Standard'],['B102','occupied','Hourly · 25m'],['B103','vacant','Standard'],['B104','dirty','Checked out'],['B105','vacant','Standard'],['B106','occupied','Daily · until 12:00'],['B201','vacant','Standard'],['B202','vacant','Standard'],['B203','occupied','Hourly · 1h 05m'],['B204','vacant','Standard'],['B205','vacant','Standard'],['B206','dirty','Checked out'],['B301','vacant','VIP'],['B302','occupied','Hourly · 3h 10m'],['B303','vacant','VIP'],['B304','vacant','VIP'],['B305','vacant','VIP']];
const rawC = [['C101','vacant','Standard'],['C102','occupied','Hourly · 40m'],['C103','vacant','Standard'],['C104','dirty','Checked out'],['C105','vacant','Standard'],['C106','occupied','Hourly · 1h 10m'],['C201','vacant','VIP'],['C202','vacant','VIP'],['C203','occupied','Hourly · 2h'],['C204','vacant','VIP'],['C205','vacant','VIP'],['C206','vacant','VIP']];
const rawD = [['D101','vacant','Standard'],['D102','vacant','Standard'],['D103','occupied','Hourly · 30m'],['D104','vacant','Standard'],['D105','dirty','Checked out'],['D201','vacant','Standard'],['D202','occupied','Hourly · 1h 45m'],['D203','vacant','Standard'],['D204','vacant','Standard'],['D205','vacant','Standard']];
const b = this.state.b;
const lists = { A: raw, B: rawB, C: rawC, D: rawD };
const locked = b === 'B';
const list = lists[b];
const self = 'MainEN.dc.html';
const rooms = list.map(([code, st, sub]) => Object.assign({ code, sub, locked, opacity: locked ? '0.62' : '1', href: locked ? self : st === 'vacant' ? 'NhanPhongEN.dc.html' : (st === 'occupied' || st === 'overdue') ? 'ChiTietEN.dc.html' : st === 'dirty' ? 'PhongCanDonEN.dc.html' : self }, S[st]));
const order = ['vacant','occupied','overdue','dirty','maint'];
const counters = order.map(k => Object.assign({ count: list.filter(r => r[1] === k).length }, S[k]));
const accent = this.props.accent ?? '#1F4E5F';
const on = { bg: accent, fg: '#FFFFFF', border: 'none' }, off = { bg: '#FFFFFF', fg: '#1C1B19', border: '1px solid #CFCBC3' };
const tabs = ['A','B','C','D'].map(k => Object.assign({ label: 'Building ' + k + ' · ' + lists[k].length, on: k === b, locked: k === 'B', pick: () => this.setState({ b: k }) }, k === b ? on : off));
return { accent, rooms, counters, tabs, isA: !locked, isB: locked, tabA: locked ? off : on, tabB: locked ? on : off, pickA: () => this.setState({ b: 'A' }), pickB: () => this.setState({ b: 'B' }) };
}
}
</script>
</body>
</html>

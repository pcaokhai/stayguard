<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F4E5F","options":["#1F4E5F","#7A3E12","#2F4B2A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const n = 25;
const finder = (r, c) => {
const spots = [[0, 0], [0, n - 7], [n - 7, 0]];
for (const [fr, fc] of spots) {
if (r >= fr && r < fr + 7 && c >= fc && c < fc + 7) {
const y = r - fr, x = c - fc;
if (y === 0 || y === 6 || x === 0 || x === 6) return 1;
if (y >= 2 && y <= 4 && x >= 2 && x <= 4) return 1;
return 0;
}
if (r >= fr - 1 && r <= fr + 7 && c >= fc - 1 && c <= fc + 7) return 0;
}
return -1;
};
const cells = [];
for (let r = 0; r < n; r++) {
for (let c = 0; c < n; c++) {
const f = finder(r, c);
const on = f === -1 ? ((r * r * 7 + c * 13 + r * c * 3) % 11) < 5 : f === 1;
cells.push({ fill: on ? '#1C1B19' : '#FFFFFF' });
}
}
return { accent: this.props.accent ?? '#1F4E5F', cells };
}
}
</script>

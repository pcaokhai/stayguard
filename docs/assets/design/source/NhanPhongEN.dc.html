<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check in A102</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#F6F4EF;color:#1C1B19}
a{color:#1F4E5F}a:hover{color:#163A47}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F4EF; display: flex; flex-direction: column; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #1C1B19">
<div style="display: flex; align-items: center; gap: 8px; padding: 16px 20px 8px 12px">
<a href="MainEN.dc.html" aria-label="Back to room map" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1C1B19; white-space: nowrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 20px; font-weight: 700">Check in A102</span>
<span style="font-size: 13px; color: #5C5A55">Building A · Standard room</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 20px; padding: 12px 20px 0 20px; flex-grow: 1">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600">Rental type</span>
<sc-for list="{{types}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.pick}}" style="min-height: 56px; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; text-align: left; font-family: inherit; background: {{t.bg}}; border: {{t.border}}; color: #1C1B19">
<span style="font-size: 15px; font-weight: 600">{{t.name}}</span>
<span style="font-size: 13px; color: #45433F">{{t.price}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Guest name
<input type="text" value="Tuan Nguyen" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCBC3; background: #FFFFFF; font-family: inherit; font-size: 15px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Phone number
<input type="tel" value="0901 234 567" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCBC3; background: #FFFFFF; font-family: inherit; font-size: 15px"></label>
<div style="display: flex; gap: 10px">
<label style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">ID number (optional)
<input type="text" value="" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCBC3; background: #FFFFFF; font-family: inherit; font-size: 15px"></label>
<label style="width: 130px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Deposit (₫)
<input type="text" value="100,000" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCBC3; background: #FFFFFF; font-family: inherit; font-size: 15px"></label>
</div>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: #ECE9E2">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#45433F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<span style="font-size: 13px; color: #45433F">Check-in time is recorded by the system when you confirm. Staff can’t change it.</span>
</div>
</div>
<div style="padding: 16px 20px 28px 20px">
<a href="MainEN.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; white-space: nowrap">Confirm check-in</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F4E5F","options":["#1F4E5F","#7A3E12","#2F4B2A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { picked: 'hour' }; }
renderVals() {
const accent = this.props.accent ?? '#1F4E5F';
const list = [
{ id: 'hour', name: 'Hourly', price: '₫80,000 first hour · +₫20,000/hr' },
{ id: 'night', name: 'Overnight', price: '₫200,000 · 21:00 to 12:00' },
{ id: 'day', name: 'Daily', price: '₫300,000 · 14:00 to 12:00' }
];
const types = list.map(t => Object.assign({}, t, {
bg: this.state.picked === t.id ? '#E6EEF0' : '#FFFFFF',
border: this.state.picked === t.id ? '2px solid ' + accent : '1px solid #CFCBC3',
pick: () => this.setState({ picked: t.id })
}));
return { accent, types };
}
}
</script>
</body>
</html>

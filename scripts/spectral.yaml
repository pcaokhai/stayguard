# Project Spectral ruleset (lane PLAT), kept outside contracts/ so contract PRs stay pure (CLAUDE.md §9).
# Not enforced on purpose: x-access, x-release and security rules, because the contract does not apply
# them to every operation today; add them after a contracts PR makes them uniform.
extends: ["spectral:oas"]
rules:
  # Strict where the project depends on it: codegen and authorization need these.
  operation-operationId: error
  operation-operationId-unique: error
  operation-tag-defined: error
  # The spec documents with summary and a prose companion (docs/04); descriptions are optional.
  operation-description: off
  info-contact: off
  # Project extension (docs/04): every operation names its owning story.
  stayguard-operation-story:
    description: Each operation carries x-story.
    # warn: POST /v1/webhooks/bank lacks x-story today; raise to error after a contracts PR adds it.
    severity: warn
    given: "$.paths[*][get,post,put,patch,delete]"
    then: { field: x-story, function: truthy }

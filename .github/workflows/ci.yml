name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"
  NODE_VERSION: "24.15.0"
  GOLANGCI_LINT_VERSION: v2.13.2
  GITLEAKS_VERSION: 8.30.1
  # sha256 of the linux x64 tarball, from the v8.30.1 release checksums file.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: api
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - name: gofmt
        run: test -z "$(gofmt -l api)"
      - name: prettier
        run: npx prettier --check .
        working-directory: web

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gitleaks (checksum-verified)
        run: scripts/install-gitleaks.sh
      - run: echo "$PWD" >> "$GITHUB_PATH"
      - run: scripts/test-makefile.sh
      - run: scripts/check-pinning.sh
      - run: scripts/check-claude-deny.sh
      - run: scripts/test-secret-scan.sh

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      - run: make test-api

  # SG-003: Testcontainers PostgreSQL (the runner has Docker); race detector on for the concurrency tests.
  test-api-int:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      - run: RACE=1 make test-api-int

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make test-web
      - run: npm run build
        working-directory: web

  # SG-002: contract checks, generated-code drift and the contract pipeline's own tests.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # oasdiff compares against origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            scripts/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Contract checks (Spectral, oasdiff, schemas, vectors)
        run: |
          # On a PR the base is origin/main. On a push to main, main would diff against itself,
          # so compare with the commit before the push (all zeros means a new branch: skip).
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git show "${{ github.event.before }}:contracts/openapi.yaml" > "$RUNNER_TEMP/base.yaml"
            BASE_FILE="$RUNNER_TEMP/base.yaml" make contracts
          else
            make contracts
          fi
      - name: Generated code is current
        run: |
          make gen
          test -z "$(git status --porcelain)" || { git status --porcelain; echo "generated code is stale: run make gen"; exit 1; }
      - run: scripts/test-contracts.sh
      - run: scripts/check-spike.sh
      - run: scripts/check-gen-headers.sh
      - run: scripts/check-mock-switch.sh
      # Reported, not blocking: docs/10 §143 limit (400 lines excluding generated files) needs a tech-lead waiver here.
      - name: PR size
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: scripts/pr-size.sh origin/${{ github.base_ref }}

  # The production image must build: the web stage type-checks files that import ../contracts, so a missing COPY breaks it only here.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production image (demo mode off)
        run: docker build -f deploy/Dockerfile --build-arg NEXT_PUBLIC_DEMO_MODE=0 -t stayguard:ci .

  # Runs the pinned gitleaks binary directly, not gitleaks-action (plan Ruling 3: no licence key).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: scripts/install-gitleaks.sh
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make licenses
